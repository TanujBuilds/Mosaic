name: Windows protected JavaScript feasibility

'on':
  push:
    branches: [codex/windows-protected-js-probe, codex/windows-protected-js-supervisor, codex/windows-protected-js-package, codex/windows-protected-js-coordinator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-javascript:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Find the x64 MSVC build tools
        shell: pwsh
        run: |
          $finder = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $finder -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Missing x64 MSVC' }
          "MOSAIC_DEV_CMD=$(Join-Path $vs 'Common7/Tools/VsDevCmd.bat')" >> $env:GITHUB_ENV
      - name: Build the Windows supervisor
        shell: cmd
        run: |
          call "%MOSAIC_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          pushd "%RUNNER_TEMP%"
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE "%GITHUB_WORKSPACE%\src\project\check-backends\windows-supervisor.cpp" /Fe:mosaic-js-test-supervisor.exe /link advapi32.lib userenv.lib
          if errorlevel 1 exit /b 1
          >>"%GITHUB_ENV%" echo MOSAIC_TEST_JS_SUPERVISOR=%RUNNER_TEMP%\mosaic-js-test-supervisor.exe
          popd
      - name: Verify the proof-of-concept runtime and run Windows tests
        shell: pwsh
        env:
          MOSAIC_ISOLATED_JS_PROBE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'quickjs-wasi-3.7.0.tgz'
          "MOSAIC_JS_TARBALL=$artifact" >> $env:GITHUB_ENV
          $integrity = '6nOShBtCglrQL6yH+hptIfEdA1WlSmvY/Mm5Ypn9IvtsaDsrYIg8x+xoIXQt02w66a0f1eLTAj1lhfgAbJ4WVw=='
          curl.exe -q --fail --silent --show-error --max-time 60 --max-filesize 4194304 --output $artifact -- 'https://registry.npmjs.org/quickjs-wasi/-/quickjs-wasi-3.7.0.tgz'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = [Security.Cryptography.SHA512]::Create()
          try {
            if ([Convert]::ToBase64String($sha.ComputeHash([IO.File]::ReadAllBytes($artifact))) -cne $integrity) {
              throw 'QuickJS runtime package integrity changed'
            }
          } finally { $sha.Dispose() }
          New-Item -ItemType Directory node_modules/quickjs-wasi -Force | Out-Null
          tar.exe -xf $artifact --strip-components=1 -C node_modules/quickjs-wasi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption) $($os.Version) $($os.OSArchitecture)"
          node --version
          git --version
          node --test test/windows-protected-js.test.mjs
          exit $LASTEXITCODE
      - name: Package the contained runtime with the existing Windows installer
        shell: cmd
        run: |
          call "%MOSAIC_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          node scripts\package-windows-beta.mjs --version 0.1.0-beta.234 --output "%RUNNER_TEMP%\Mosaic JavaScript candidate" --check-js-tgz "%MOSAIC_JS_TARBALL%"
          exit /b %ERRORLEVEL%
      - name: Verify the actual installed artifact and reject tampered runtime bytes
        shell: pwsh
        run: node .github/scripts/windows-protected-js-installed.mjs (Join-Path $env:RUNNER_TEMP 'Mosaic JavaScript candidate')
      - name: Retain the held package for further qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosaic-windows-isolated-js-held
          path: ${{ runner.temp }}/Mosaic JavaScript candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
