name: Held Windows artifact follow-up evidence

'on':
  push:
    branches:
      - codex/windows-ci-followups

permissions:
  contents: read
  actions: read

jobs:
  held-evidence:
    name: Exact Windows core upgrade and scheduler ownership
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2f938fd74dd3920e11d4f33de636e1cc8cde388e
          path: early
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1b18fe835d633bee4d313e25e013f3d1d6c4d94
          path: held
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the early artifact by run and immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 44988516524
          artifact-ids: 14740862102
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic early archive
      - name: Download the held artifact by run and immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 44990711044
          artifact-ids: 14742095178
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic held archive
      - name: Exercise installed cold upgrade, MCP and scheduled task ownership
        shell: pwsh
        run: node qa/.github/scripts/windows-held-evidence.mjs early held (Join-Path $env:RUNNER_TEMP 'Mosaic early archive') (Join-Path $env:RUNNER_TEMP 'Mosaic held archive')
