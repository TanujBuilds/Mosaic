name: Signed-out Codex app-server with installed Windows Beta

'on':
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      candidate_pin:
        required: true
        type: string
  push:
    branches:
      - codex/windows-codex-installed
      - codex/windows-js-hosts
      - codex/windows-js-worker-hosts

permissions:
  actions: read
  contents: read

jobs:
  codex-installed:
    name: Installed Windows Beta and Codex app-server MCP handshake
    runs-on: windows-2025
    env:
      MOSAIC_QA_CANDIDATE: ${{ inputs.candidate_pin }}
      MOSAIC_QA_ARTIFACT_ID: ${{ inputs.artifact_id }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the frozen Beta artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_id && github.run_id || (github.ref == 'refs/heads/codex/windows-js-worker-hosts' && '45055488089' || github.ref == 'refs/heads/codex/windows-js-hosts' && '45052575762' || '44991971753') }}
          artifact-ids: ${{ inputs.artifact_id || (github.ref == 'refs/heads/codex/windows-js-worker-hosts' && '14767202712' || github.ref == 'refs/heads/codex/windows-js-hosts' && '14766183423' || '14742128055') }}
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic frozen Beta
      - name: Verify the vendor executable and run it with an active network block
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Disposable hosted Windows x64 runner required' }
          $root = Join-Path $env:RUNNER_TEMP ('Mosaic signed-out Codex ' + [guid]::NewGuid())
          $bundle = Join-Path $env:RUNNER_TEMP 'Mosaic frozen Beta'
          $bin = Join-Path $root '.codex\packages\standalone\current\bin'
          $exe = Join-Path $bin 'codex.exe'
          $rule = 'MosaicVendorCLI-' + [guid]::NewGuid()
          $policy = $null
          try {
            New-Item -ItemType Directory -Path $bin -Force | Out-Null
            $asset = 'https://github.com/openai/codex/releases/download/rust-v0.171.0/codex-x86_64-pc-windows-msvc.exe'
            $sha = 'cefea4ffee1fff04983a99c0dda99944d8b380e891e740a28b32f4b815a6e0b7'
            $curl = Join-Path ([Environment]::SystemDirectory) 'curl.exe'
            & $curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 240 --max-filesize 407421232 --output $exe -- $asset
            if ($LASTEXITCODE -ne 0 -or (Get-Item -LiteralPath $exe).Length -ne 407421232 -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ine $sha) { throw 'Codex release artifact verification failed' }
            $policy = New-NetFirewallRule -Name $rule -DisplayName $rule -Direction Outbound -Action Block -Program $exe -Profile Any
            $profiles = @(Get-NetFirewallProfile -PolicyStore ActiveStore)
            if ($profiles.Count -ne 3 -or @($profiles | Where-Object Enabled -ne 'True').Count) { throw 'All firewall profiles must enforce policy' }
            $active = Get-NetFirewallRule -PolicyStore ActiveStore -Name $rule
            if ($active.Enabled -ne 'True' -or $active.Direction -ne 'Outbound' -or $active.Action -ne 'Block' -or $active.Profile -ne 'Any') { throw 'Active vendor network block unavailable' }
            $program = Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $active
            if ($program.Program -ine $exe) { throw 'Firewall rule does not identify the verified executable' }
            Write-Output 'Verified active outbound firewall block for the pinned Codex app-server executable.'
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
            node .github/scripts/windows-codex-installed.mjs $root $exe $bundle
            if ($LASTEXITCODE -ne 0) { throw 'Installed Codex app-server MCP handshake evidence failed' }
          } finally {
            $fixtureProcesses = @(Get-Process -Name codex -ErrorAction SilentlyContinue | Where-Object Path -eq $exe)
            foreach ($process in $fixtureProcesses) {
              Stop-Process -Id $process.Id -Force
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            if (Get-Process -Name codex -ErrorAction SilentlyContinue | Where-Object Path -eq $exe) { throw 'Retain firewall policy while fixture processes remain' }
            if ($policy) { Remove-NetFirewallRule -Name $rule }
            if (Test-Path -LiteralPath $root) { Remove-Item -Recurse -Force -LiteralPath $root }
          }
