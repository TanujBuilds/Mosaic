name: Windows source, protected checks, and installer

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 source and platform tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Report Windows runner versions
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption) $($os.Version) $($os.OSArchitecture)"
          Write-Output "Runner image: $env:ImageOS ($env:ImageVersion)"
          Write-Output "PowerShell: $($PSVersionTable.PSVersion)"
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable coordinator and committed Git fixture tests on Windows
        run: node --test --test-concurrency=1 test/coordinator.test.mjs .github/scripts/windows-first-task-fixture.test.mjs
      - &find-x64-supervisor
        name: Find native build inputs
        id: native
        shell: pwsh
        run: |
          $source = Test-Path -LiteralPath 'src/project/check-backends/windows-supervisor.cpp' -PathType Leaf
          $test = Test-Path -LiteralPath 'test/windows-protected-checks.test.mjs' -PathType Leaf
          if (-not $source -or -not $test) {
            throw 'The required Windows supervisor and its protected-check tests must be present.'
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'The x64 MSVC toolchain is unavailable.' }
          $devCmd = Join-Path $visualStudio 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw 'VsDevCmd.bat is unavailable.' }
          "dev_cmd=$devCmd" >> $env:GITHUB_OUTPUT
      - &build-x64-supervisor
        name: Build the x64 Windows protected-check supervisor
        shell: cmd
        env:
          MOSAIC_VS_DEV_CMD: ${{ steps.native.outputs.dev_cmd }}
        run: |
          call "%MOSAIC_VS_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          pushd "%RUNNER_TEMP%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE "%GITHUB_WORKSPACE%\src\project\check-backends\windows-supervisor.cpp" /Fe:mosaic-windows-supervisor.exe /link advapi32.lib userenv.lib
          if errorlevel 1 exit /b 1
          if not exist "mosaic-windows-supervisor.exe" exit /b 1
          >>"%GITHUB_ENV%" echo MOSAIC_TEST_WINDOWS_SUPERVISOR=%RUNNER_TEMP%\mosaic-windows-supervisor.exe
          popd
      - name: Run Windows platform tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath test -File -Filter 'windows-*.test.mjs' |
            Where-Object Name -ne 'windows-protected-checks.test.mjs' | Sort-Object Name | ForEach-Object FullName)
          if ($tests.Count -eq 0) {
            Write-Output '::notice::No Windows-specific platform tests have landed.'
            exit 0
          }
          $tests | Write-Output
          node --test --test-concurrency=1 @tests
          exit $LASTEXITCODE

  windows-isolation:
    name: Required Windows x64 protected execution qualification
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Report Windows runner and Node versions
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption) $($os.Version) $($os.OSArchitecture)"
          Write-Output "Runner image: $env:ImageOS ($env:ImageVersion)"
          Write-Output "PowerShell: $($PSVersionTable.PSVersion)"
          node --version
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - *find-x64-supervisor
      - *build-x64-supervisor
      - name: Run native protected execution tests
        run: node --test --test-concurrency=1 test/windows-protected-checks.test.mjs
      - name: Record remaining release gates
        if: always()
        shell: pwsh
        run: |
          @'
          Runner: Windows Server 2025 x64. The native supervisor and protected execution tests are required.
          A Windows 11 x64 client and signed-in coding apps require separate candidate qualification.
          '@ >> $env:GITHUB_STEP_SUMMARY

  package-inputs:
    name: Check Windows packaging inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Windows package sources
        id: detect
        shell: bash
        run: |
          if [[ ! -f install.ps1 && ! -f scripts/package-windows-beta.mjs ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Windows package build pending. The packager and bootstrap are absent.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for file in install.ps1 scripts/package-windows-beta.mjs \
            distribution/windows/launcher.cpp distribution/windows/guide.ps1 distribution/windows/lifecycle.mjs \
            distribution/onboarding/windows-host.mjs distribution/win32-files/mosaic-files.cpp \
            src/project/check-backends/windows-supervisor.cpp test/windows-package.test.mjs; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required Windows package input missing: $file"
              exit 1
            fi
          done
          echo 'available=true' >> "$GITHUB_OUTPUT"

  package:
    name: Windows x64 build and installed package smoke
    needs: package-inputs
    if: needs.package-inputs.outputs.available == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_pin: ${{ steps.pin.outputs.candidate }}
    env:
      MOSAIC_PACKAGE_VERSION: '0.1.0-beta.229'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Locate x64 MSVC and PowerShell 7
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'The x64 MSVC toolchain is unavailable.' }
          $devCmd = Join-Path $visualStudio 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw 'VsDevCmd.bat is unavailable.' }
          "MOSAIC_VS_DEV_CMD=$devCmd" >> $env:GITHUB_ENV
          "MOSAIC_PACKAGE_DIR=$(Join-Path $env:RUNNER_TEMP 'Mosaic Windows candidate')" >> $env:GITHUB_ENV
          "MOSAIC_PWSH=$((Get-Command pwsh.exe -CommandType Application).Source)" >> $env:GITHUB_ENV
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption) $($os.Version) $($os.OSArchitecture)"
          Write-Output "PowerShell $($PSVersionTable.PSVersion)"
          git --version
      - name: Build the Windows candidate
        shell: cmd
        run: |
          call "%MOSAIC_VS_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          node.exe scripts\package-windows-beta.mjs --version "%MOSAIC_PACKAGE_VERSION%" --output "%MOSAIC_PACKAGE_DIR%"
          if errorlevel 1 exit /b 1
      - name: Validate install, interruption, recovery and tamper rejection
        shell: pwsh
        run: node .github/scripts/windows-package-smoke.mjs "$env:MOSAIC_PACKAGE_DIR" "$env:MOSAIC_PWSH"
      - name: Record verified candidate inputs for installed app tests
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content -Raw -LiteralPath (Join-Path $env:MOSAIC_PACKAGE_DIR 'candidate.json') | ConvertFrom-Json
          if ($pin.sourceCommit -cne $env:GITHUB_SHA) { throw 'Package commit differs from checkout' }
          $fields = $pin | Select-Object sourceCommit, sourceTree, archiveSha256, packageManifestSha256, bootstrapSha256
          "candidate=$($fields | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
      - name: Upload verified local candidate bundle for staging
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosaic-windows-x64-candidate-${{ github.run_attempt }}
          path: ${{ env.MOSAIC_PACKAGE_DIR }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Record the qualification scope
        shell: pwsh
        run: |
          @'
          The exact local artifact passed basic installation and interrupted extraction recovery on Windows Server 2025 x64. The stable launcher found bundled Node with system tools only on PATH. Installed maintenance and standalone core have separate jobs.
          Anonymous HTTPS download, a clean Windows 11 client and real signed-in coding apps still require qualification before publishing a Windows install link.
          '@ >> $env:GITHUB_STEP_SUMMARY

  windows-beta-operator:
    name: Windows x64 installed Beta operator walk-through
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the exact verified Beta package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic Windows candidate
      - name: Exercise the installed Beta operator commands
        shell: pwsh
        run: node .github/scripts/windows-beta-operator.mjs (Join-Path $env:RUNNER_TEMP 'Mosaic Windows candidate')

  windows-core:
    name: Windows x64 standalone coding core
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the separate Windows coding core
        id: core
        shell: pwsh
        run: |
          $present = Test-Path -LiteralPath 'scripts/package-windows-core.mjs' -PathType Leaf
          if (-not $present) {
            'Windows coding core smoke: pending source.' >> $env:GITHUB_STEP_SUMMARY
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          foreach ($file in @('activate.ps1', 'core.mjs', 'mosaic-core.ps1')) {
            if (-not (Test-Path -LiteralPath "distribution/windows-core/$file" -PathType Leaf)) {
              throw "The Windows coding core is missing $file."
            }
          }
          'available=true' >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.core.outputs.available == 'true'
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the exact Beta build that passed basic installation
        if: steps.core.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic Windows candidate
      - name: Independently build, install, and exercise the Windows coding core
        if: steps.core.outputs.available == 'true'
        shell: pwsh
        run: node .github/scripts/windows-core-smoke.mjs (Join-Path $env:RUNNER_TEMP 'Mosaic Windows candidate')

      - name: Retain the exercised standalone core candidate
        if: steps.core.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosaic-windows-x64-core-candidate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Verified standalone core/mosaic-core-windows-x64.zip
            ${{ runner.temp }}/Verified standalone core/activate.ps1
            ${{ runner.temp }}/Verified standalone core/package-manifest.json
            ${{ runner.temp }}/Verified standalone core/candidate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-maintenance:
    name: Windows x64 installed maintenance
    needs: package
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find maintenance and x64 build inputs
        id: maintenance
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'distribution/windows/maintenance.mjs' -PathType Leaf)) {
            'Installed maintenance: pending source.' >> $env:GITHUB_STEP_SUMMARY
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'The x64 MSVC toolchain is unavailable.' }
          $devCmd = Join-Path $visualStudio 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw 'VsDevCmd.bat is unavailable.' }
          "MOSAIC_VS_DEV_CMD=$devCmd" >> $env:GITHUB_ENV
          "MOSAIC_UPDATE_FIXTURE_DIR=$(Join-Path $env:RUNNER_TEMP 'Mosaic Windows update fixture')" >> $env:GITHUB_ENV
          "MOSAIC_PWSH=$((Get-Command pwsh.exe -CommandType Application).Source)" >> $env:GITHUB_ENV
          'available=true' >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.maintenance.outputs.available == 'true'
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the exact Beta build that passed basic installation
        if: steps.maintenance.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic Windows candidate
      - name: Build the compatible test update
        if: steps.maintenance.outputs.available == 'true'
        shell: cmd
        run: |
          call "%MOSAIC_VS_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          node.exe scripts\package-windows-beta.mjs --version 0.1.0-beta.230 --output "%MOSAIC_UPDATE_FIXTURE_DIR%"
          if errorlevel 1 exit /b 1
      - name: Run install, update, rollback, recovery, uninstall, and reinstall
        if: steps.maintenance.outputs.available == 'true'
        shell: pwsh
        run: node .github/scripts/windows-package-smoke.mjs (Join-Path $env:RUNNER_TEMP 'Mosaic Windows candidate') "$env:MOSAIC_PWSH" "$env:MOSAIC_UPDATE_FIXTURE_DIR"

  windows-download:
    name: Windows x64 interrupted HTTPS download and recovery
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the private loopback HTTPS fixture
        id: smoke
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.github/scripts/windows-download-smoke.mjs' -PathType Leaf) {
            'available=true' >> $env:GITHUB_OUTPUT
          } else {
            'Interrupted HTTPS download: pending the private loopback fixture.' >> $env:GITHUB_STEP_SUMMARY
            'available=false' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.smoke.outputs.available == 'true'
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download the exact Beta artifact into the isolated test runner
        if: steps.smoke.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/Mosaic Windows candidate
      - name: Verify HTTPS interruption and one-line recovery using exact candidate bytes
        if: steps.smoke.outputs.available == 'true'
        shell: pwsh
        run: node .github/scripts/windows-download-smoke.mjs (Join-Path $env:RUNNER_TEMP 'Mosaic Windows candidate')

  windows-arm-diagnostics:
    name: Windows 11 ARM64 host capability diagnostics
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate MSVC ARM64 tools for the diagnostic
        id: inputs
        shell: pwsh
        run: |
          $source = 'src/project/check-backends/windows-supervisor.cpp'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or -not (Select-String -LiteralPath $source -SimpleMatch '--host-security' -Quiet)) {
            'Windows 11 ARM64 diagnostic: pending host probe.' >> $env:GITHUB_STEP_SUMMARY
            'available=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'The ARM64 MSVC toolchain is unavailable.' }
          $devCmd = Join-Path $visualStudio 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw 'VsDevCmd.bat is unavailable.' }
          "MOSAIC_ARM_VS_DEV_CMD=$devCmd" >> $env:GITHUB_ENV
          'available=true' >> $env:GITHUB_OUTPUT
      - name: Compile the native ARM64 supervisor
        if: steps.inputs.outputs.available == 'true'
        shell: cmd
        run: |
          call "%MOSAIC_ARM_VS_DEV_CMD%" -arch=arm64 -host_arch=arm64
          if errorlevel 1 exit /b 1
          pushd "%RUNNER_TEMP%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE "%GITHUB_WORKSPACE%\src\project\check-backends\windows-supervisor.cpp" /Fe:mosaic-arm-supervisor.exe /link advapi32.lib userenv.lib
          if errorlevel 1 exit /b 1
          if not exist "mosaic-arm-supervisor.exe" exit /b 1
          popd
      - name: Record Windows and process security environment capabilities
        if: steps.inputs.outputs.available == 'true'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'mosaic-arm-supervisor.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xaa64) { throw 'The diagnostic executable is not native ARM64.' }
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "$($os.Caption) $($os.Version) $($os.OSArchitecture)"
          $dll = Get-Item -LiteralPath (Join-Path ([Environment]::SystemDirectory) 'processmodel.dll') -ErrorAction SilentlyContinue
          if ($dll) { Write-Output "processmodel.dll $($dll.VersionInfo.FileVersion)" }
          else { Write-Output 'processmodel.dll is unavailable in System32.' }
          $raw = & $exe --host-security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagnostic = $raw | ConvertFrom-Json
          foreach ($name in @('build', 'revision', 'client', 'processModel', 'createEnvironment', 'closeEnvironment',
              'versionResult', 'version1', 'minor', 'supportResult', 'supportFlags')) {
            if ($name -notin $diagnostic.PSObject.Properties.Name) { throw "Host diagnostic field missing: $name" }
          }
          $raw | Write-Output
          'Windows 11 ARM64 host capability diagnostics. This run does not qualify protected execution or Windows 11 x64.' >> $env:GITHUB_STEP_SUMMARY
          "Host probe: $raw" >> $env:GITHUB_STEP_SUMMARY

  claude-current-installed:
    needs: package
    if: github.ref == 'refs/heads/codex/windows-ci-qualification' || github.ref == 'refs/heads/codex/windows-installed-current'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/windows-claude-installed.yml
    with:
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      candidate_pin: ${{ needs.package.outputs.candidate_pin }}

  codex-current-installed:
    needs: package
    if: github.ref == 'refs/heads/codex/windows-ci-qualification' || github.ref == 'refs/heads/codex/windows-installed-current'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/windows-codex-installed.yml
    with:
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      candidate_pin: ${{ needs.package.outputs.candidate_pin }}
